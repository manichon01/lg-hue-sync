<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LG Hue Sync capture patches</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    #patch { position: fixed; inset: 0; background: #808080; }
    #controls { position: fixed; top: 12px; left: 12px; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; color: white; background: #111e; font: 16px system-ui, sans-serif; border-radius: 8px; }
    button, select { font: inherit; padding: 6px; }
    #note { max-width: 30rem; font-size: 13px; }
    :fullscreen #controls { display: none; }
    #tune { position: fixed; bottom: 12px; left: 12px; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 12px; color: white; background: #111e; font: 14px system-ui, sans-serif; max-width: calc(100vw - 48px); }
    #tune label { display: flex; align-items: center; gap: 6px; }
    #tune input[type=range] { width: 9rem; }
    #lights { display: flex; gap: 6px; align-items: center; }
    #lights span { width: 2.2rem; height: 1.4rem; border: 1px solid #fff8; border-radius: 4px; background: #000; }
    #tuneNote { font-size: 12px; opacity: .8; }
    :fullscreen #tune { display: none; }
  </style>
</head>
<body>
  <div id="patch" aria-hidden="true"></div>
  <div id="controls">
    <label for="choice">Screen patch</label>
    <select id="choice">
      <option value="black">Black #000000</option>
      <option value="near-black">Near black #101010</option>
      <option value="gray18">Gray #777777</option>
      <option value="mid-gray" selected>Mid-gray #808080</option>
      <option value="white">White #ffffff</option>
      <option value="red">Red #ff0000</option>
      <option value="green">Green #00ff00</option>
      <option value="blue">Blue #0000ff</option>
      <option value="cyan">Cyan #00ffff</option>
      <option value="magenta">Magenta #ff00ff</option>
      <option value="yellow">Yellow #ffff00</option>
      <option value="skin">Skin tone #c88c78</option>
      <option value="pastel-blue">Pastel blue #6e96dc</option>
      <option value="dark-blue">Dark blue #1e3278</option>
    </select>
    <button id="previous" type="button">Previous</button>
    <button id="next" type="button">Next</button>
    <button id="fullscreen" type="button">Fullscreen</button>
    <span id="note">The lights mirror the colour on screen. Leaving this page returns them to sync.</span>
  </div>
  <div id="tune">
    <label><input id="directRgb" type="checkbox"> Direct RGB</label>
    <label>Saturation <input id="saturation" type="range" min="0.5" max="2.5" step="0.1"> <output id="saturationOut"></output></label>
    <label>Brightness <input id="brightness" type="range" min="0.5" max="2.5" step="0.1"> <output id="brightnessOut"></output></label>
    <span id="lights" title="Colour currently sent to each Hue light"></span>
    <span id="tuneNote">Changes apply live and are saved.</span>
  </div>
  <script>
    const colors = {
      black: '#000000', 'near-black': '#101010', gray18: '#777777',
      'mid-gray': '#808080', white: '#ffffff', red: '#ff0000',
      green: '#00ff00', blue: '#0000ff', cyan: '#00ffff',
      magenta: '#ff00ff', yellow: '#ffff00',
      skin: '#c88c78', 'pastel-blue': '#6e96dc', 'dark-blue': '#1e3278'
    };
    const choice = document.getElementById('choice');
    // The lights show the same colour as the screen, through the normal colour processing,
    // so screen and lights can be compared and the Tuning settings adjusted.
    function mirrorToLights(name) {
      const hex = colors[name].slice(1);
      const body = JSON.stringify({
        r: parseInt(hex.slice(0, 2), 16), g: parseInt(hex.slice(2, 4), 16), b: parseInt(hex.slice(4, 6), 16)
      });
      fetch('/api/test-color', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }).catch(() => {});
    }
    function releaseLights() {
      // Hand the lights back to normal sync when this page is left.
      try { navigator.sendBeacon('/api/test-pattern/off'); } catch (_) { /* best effort */ }
    }
    window.addEventListener('pagehide', releaseLights);
    function show(name) {
      if (!Object.prototype.hasOwnProperty.call(colors, name)) return;
      choice.value = name;
      document.getElementById('patch').style.backgroundColor = colors[name];
      mirrorToLights(name);
    }
    function move(offset) {
      const next = (choice.selectedIndex + offset + choice.options.length) % choice.options.length;
      show(choice.options[next].value);
    }
    choice.addEventListener('change', () => show(choice.value));
    document.getElementById('previous').addEventListener('click', () => move(-1));
    document.getElementById('next').addEventListener('click', () => move(1));
    document.getElementById('fullscreen').addEventListener('click', () => document.documentElement.requestFullscreen?.());
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') move(-1);
      if (event.key === 'ArrowRight') move(1);
    });
    show(choice.value);

    // Live light settings, so colour can be tuned while a patch is on screen.
    const tune = { settings: null, timer: 0, saveTimer: 0 };
    const $ = id => document.getElementById(id);
    function syncTune() {
      const v = tune.settings;
      if (!v) return;
      $('directRgb').checked = !v.use_xy_gamut;
      $('saturation').value = v.saturation_boost; $('saturationOut').textContent = Number(v.saturation_boost).toFixed(1) + '×';
      $('brightness').value = v.brightness_multiplier; $('brightnessOut').textContent = Number(v.brightness_multiplier).toFixed(1) + '×';
    }
    async function pushTune(change) {
      if (!tune.settings) return;
      Object.assign(tune.settings, change);
      syncTune();
      clearTimeout(tune.timer);
      tune.timer = setTimeout(async () => {
        try {
          await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tune.settings) });
          clearTimeout(tune.saveTimer);
          tune.saveTimer = setTimeout(() => fetch('/api/save-config', { method: 'POST' }).catch(() => {}), 1000);
        } catch (_) { $('tuneNote').textContent = 'Could not reach the daemon.'; }
      }, 150);
    }
    async function pollTune() {
      try {
        const status = await (await fetch('/api/status')).json();
        if (!tune.settings && status.settings) { tune.settings = status.settings; syncTune(); }
        const box = $('lights');
        const colours = status.hue_colors || [];
        while (box.children.length < colours.length) box.appendChild(document.createElement('span'));
        colours.forEach(([, c], i) => { box.children[i].style.background = `rgb(${c.r},${c.g},${c.b})`; });
      } catch (_) { /* daemon stopped or restarting */ }
    }
    $('directRgb').addEventListener('change', e => pushTune({ use_xy_gamut: !e.target.checked }));
    $('saturation').addEventListener('input', e => pushTune({ saturation_boost: Number(e.target.value) }));
    $('brightness').addEventListener('input', e => pushTune({ brightness_multiplier: Number(e.target.value) }));
    pollTune(); setInterval(pollTune, 500);
  </script>
</body>
</html>
